[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "egtsat"
version = "0.1.0"
description = "Evolutionary-game-theoretic satellite selection: a small educational reference implementation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "futation" }]
requires-python = ">=3.10"
keywords = [
    "evolutionary game theory",
    "replicator dynamics",
    "LEO satellite",
    "network selection",
    "load balancing",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
